apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ufcpro-mcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/rahulsingh/ufcpro-mcp.git
    targetRevision: main
    path: deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: ufcpro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
