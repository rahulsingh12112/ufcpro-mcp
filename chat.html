<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ufcpro.in — Job Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
           background: #0f172a; color: #e2e8f0; height: 100vh; display: flex;
           flex-direction: column; }
    header { padding: 16px 20px; background: #1e293b; font-weight: 600; font-size: 18px;
             border-bottom: 1px solid #334155; }
    header small { font-weight: 400; color: #94a3b8; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 14px; }
    .msg { max-width: 760px; padding: 12px 16px; border-radius: 12px; line-height: 1.5;
           white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .bot  { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .bot a { color: #60a5fa; }
    form { display: flex; gap: 10px; padding: 16px 20px; background: #1e293b;
           border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569;
            background: #0f172a; color: #e2e8f0; font-size: 15px; }
    button { padding: 12px 22px; border: none; border-radius: 10px; background: #2563eb;
             color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span>ufcpro.in Job Assistant <small>— powered by MCP + Claude</small></span>
    <span id="account" style="float:right; font-size:14px;"></span>
  </header>
  <div id="chat">
    <div class="msg bot">Hi! Ask me things like "find top 3 devops jobs in India" or "which AI roles are open?"</div>
  </div>
  <form id="form">
    <input id="input" placeholder="Type your message..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const account = document.getElementById('account');

    fetch('/me').then(r => r.json()).then(d => {
      account.innerHTML = d.user
        ? `${d.user} &nbsp; <a href="/logout" style="color:#60a5fa;">Logout</a>`
        : `<a href="/login" style="color:#60a5fa;">Login</a>`;
    });

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = cls === 'bot'
        ? text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        : text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      addMsg(q, 'user');
      input.value = '';
      send.disabled = true;
      const thinking = addMsg('Thinking...', 'bot');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q })
        });
        if (res.status === 401) {
          thinking.remove();
          addMsg('Please log in first — redirecting...', 'bot');
          setTimeout(() => { window.location.href = '/login'; }, 1200);
          return;
        }
        const data = await res.json();
        thinking.remove();
        addMsg(data.reply || '(no reply)', 'bot');
      } catch (err) {
        thinking.remove();
        addMsg('Error: ' + err, 'bot');
      }
      send.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
